[project]
name = "ht-ibkr-integrations"
version = "0.1.0"
description = "Utilities and tools for algorithmic trading using IBKR TWS API"
authors = [
    { name = "Robert Boivin", email = "your_email@example.com" },
    { name = "Gregory Delespes", email = "gregory.delespes@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "protobuf (==5.29.3)",
    "ibapi (>=9.81.1.post1,<10.0.0)"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
scan = "app.main:main"
loadstrategy = "app.loadstrategy:main"
init-db = "app.utils.db_init:initialize_database"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["config.json", "dto/table_definitions.sql", "strategies/*.json"]